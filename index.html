<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Hello, World! Once Again</h1>
  <p>This is a basic test page.</p>
  <button id="btn">Click me</button>
  <p id="output"></p>

  <script>
    let count = 0;
    document.getElementById("btn").addEventListener("click", () => {
      count++;
      document.getElementById("output").textContent = `Clicked ${count} time(s)`;
    });
  </script>
</body>
</html>
